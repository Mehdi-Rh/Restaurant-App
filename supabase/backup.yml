# Weekly backup of every shop (settings, categories, items) into backups/ in this repo.
# Free Supabase has no backups. Copy this file to .github/workflows/backup.yml.
# Optional but recommended: add the secret SUPABASE_SECRET_KEY (GitHub → Settings → Secrets → Actions)
# so suspended shops are included too. Without it, only open shops are saved. Photos stay in Supabase Storage.
name: weekly-backup
on:
  schedule: [{ cron: "0 3 * * 1" }]     # Monday 04:00 Algeria
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export shops
        env:
          SECRET: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          URL=$(grep -o 'https://[a-z0-9]*\.supabase\.co' config.js | head -1)
          KEY=${SECRET:-$(grep -o 'sb_publishable_[A-Za-z0-9_-]*' config.js | head -1)}
          mkdir -p backups
          curl -sf "$URL/rest/v1/shops?select=id,owner,status,paid_until,settings,categories(*),items(*)" -H "apikey: $KEY" > backups/shops.json
          python3 -c "import json;d=json.load(open('backups/shops.json'));print(len(d),'shops',sum(len(s['items']) for s in d),'items')"
      - name: Commit
        run: |
          git config user.name "backup-bot"; git config user.email "backup-bot@users.noreply.github.com"
          git add backups/shops.json
          git diff --cached --quiet || git commit -m "Weekly backup $(date +%F)"
          git push
