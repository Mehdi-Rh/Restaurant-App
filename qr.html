<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>QR code · Affiche</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f3f4f6;color:#111}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:19px;margin:4px 0 12px}
label{display:block;font-size:13px;font-weight:600;margin-top:10px}
input{width:100%;font:inherit;font-size:16px;border:1px solid #d1d5db;border-radius:8px;padding:9px 10px;margin-top:3px}
.row{display:flex;gap:8px}.row>*{flex:1}
canvas{width:100%;height:auto;border-radius:12px;margin-top:14px;box-shadow:0 2px 10px rgba(0,0,0,.12);background:#fff}
button{font:inherit;font-weight:600;border:0;border-radius:999px;padding:12px 16px;margin-top:12px;width:100%;background:#2563eb;color:#fff;cursor:pointer}
button.alt{background:#fff;color:#111;border:1px solid #d1d5db}
</style>
</head>
<body>
<div class="wrap">
  <h1>📱 QR code pour le client</h1>
  <label>Lien du site<input id="url" type="url" inputmode="url"></label>
  <div class="row">
    <label>Titre<input id="title"></label>
    <label>Couleur<input id="color" type="color" style="height:42px;padding:2px"></label>
  </div>
  <label>Texte<input id="sub" value="Scannez pour commander sur WhatsApp"></label>
  <label>Texte (arabe)<input id="sub2" dir="rtl" value="امسح الرمز للطلب عبر واتساب"></label>
  <canvas id="cv" width="1200" height="1600"></canvas>
  <button id="dl">⬇️ Télécharger l'affiche (PNG)</button>
  <button id="dlq" class="alt">⬇️ QR seul (PNG)</button>
</div>
<script src="lib/qrcode.js"></script>
<script src="config.js"></script>
<script>
(function(){
var C=window.CONFIG||{}, B=C.business||{};
var $=function(i){return document.getElementById(i);};
var SHOP=(/[?&]shop=([a-z0-9-]+)/.exec(location.search)||[])[1]||C.shop||null;
function shopLink(){ if(!SHOP) return location.href.replace(/qr\.html.*$/,'');
  return C.baseDomain ? 'https://'+SHOP+'.'+C.baseDomain+'/' : location.origin+'/'+SHOP; }
$('url').value=shopLink();
$('title').value=B.name||'';
$('color').value=(C.colors&&C.colors.primary)||'#d62828';
function qr(text){ var q=qrcode(0,'M'); q.addData(unescape(encodeURIComponent(text))); q.make(); return q; }
function drawQR(ctx,q,x,y,size){
  var n=q.getModuleCount(), m=size/(n+8); ctx.fillStyle='#fff'; ctx.fillRect(x,y,size,size); ctx.fillStyle='#111';
  for(var r=0;r<n;r++)for(var c=0;c<n;c++) if(q.isDark(r,c)) ctx.fillRect(Math.floor(x+(c+4)*m),Math.floor(y+(r+4)*m),Math.ceil(m),Math.ceil(m));
}
function wrapText(ctx,txt,x,y,maxW,lh){
  var words=txt.split(' '),line='',lines=[];
  words.forEach(function(w){ var t=line?line+' '+w:w; if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w;} else line=t; });
  lines.push(line); lines.forEach(function(l,i){ctx.fillText(l,x,y+i*lh);}); return lines.length;
}
function draw(){
  var cv=$('cv'), ctx=cv.getContext('2d'), W=cv.width, H=cv.height, col=$('color').value;
  ctx.fillStyle=col; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff'; ctx.textAlign='center';
  ctx.font='bold 92px system-ui,sans-serif'; wrapText(ctx,$('title').value,W/2,190,W-120,100);
  ctx.fillStyle='#fff'; roundRect(ctx,150,330,900,900,48); ctx.fill();
  try{ drawQR(ctx,qr($('url').value||' '),170,350,860); }catch(e){}
  ctx.fillStyle='#fff'; ctx.font='600 50px system-ui,sans-serif'; wrapText(ctx,$('sub').value,W/2,1320,W-120,60);
  ctx.font='600 52px "Noto Sans Arabic",Tahoma,sans-serif'; ctx.direction='rtl'; wrapText(ctx,$('sub2').value,W/2,1400,W-120,62); ctx.direction='ltr';
  ctx.globalAlpha=.85; ctx.font='36px system-ui,sans-serif'; ctx.fillText($('url').value.replace(/^https?:\/\//,'').replace(/\/$/,''),W/2,1530); ctx.globalAlpha=1;
}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function save(canvas,name){ var a=document.createElement('a'); a.download=name; a.href=canvas.toDataURL('image/png'); document.body.appendChild(a); a.click(); a.remove(); }
['url','title','color','sub','sub2'].forEach(function(i){ $(i).addEventListener('input',draw); });
$('dl').onclick=function(){ save($('cv'),'affiche-qr'+(SHOP?'-'+SHOP:'')+'.png'); };
$('dlq').onclick=function(){ var c=document.createElement('canvas'); c.width=c.height=1000; drawQR(c.getContext('2d'),qr($('url').value),0,0,1000); save(c,'qr.png'); };
draw();
if (C.supabase && C.supabase.url && SHOP) {
  fetch(C.supabase.url.replace(/\/$/,'') + '/rest/v1/shops?id=eq.' + encodeURIComponent(SHOP) + '&select=settings', { headers: { apikey: C.supabase.key } })
    .then(function(r){ return r.json(); }).then(function(rows){ var st = rows[0] && rows[0].settings || {};
      if (st.business && st.business.name && !$('title').value) $('title').value = st.business.name;
      if (st.colors && st.colors.primary) $('color').value = st.colors.primary; draw(); }).catch(function(){});
}
})();
</script>
</body>
</html>
