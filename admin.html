<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#111827">
<title>Gestion · Menu</title>
<style>
:root{--p:#111827;--acc:#16a34a;--bg:#f3f4f6;--card:#fff;--line:#e5e7eb;--muted:#6b7280;--red:#dc2626;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:#111;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px;color:inherit;width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:#6366f1}
textarea{min-height:70px;resize:vertical}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
/* login */
.login{min-height:100%;display:grid;place-items:center;padding:24px}
.login form{width:100%;max-width:360px;background:#fff;border-radius:18px;padding:24px;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.login h1{font-size:22px;margin-bottom:4px}
.login p{color:var(--muted);margin-bottom:18px}
.login label{display:block;margin-top:12px;font-weight:600;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;padding:12px 18px;font-weight:700;min-height:48px}
.btn.pri{background:var(--p);color:#fff;width:100%}
.btn.green{background:var(--acc);color:#fff}
.btn.ghost{background:#fff;border:1.5px solid var(--line)}
.btn.danger{color:var(--red);background:#fff;border:1.5px solid #fecaca}
.btn[disabled]{opacity:.5}
.err{color:var(--red);font-size:14px;margin-top:10px}
/* top bar */
.top{position:sticky;top:0;z-index:5;background:var(--p);color:#fff}
.top .wrap{display:flex;align-items:center;gap:10px;height:56px}
.top h1{font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top a,.top button{color:#fff;font-size:14px;text-decoration:none;background:rgba(255,255,255,.12);border-radius:999px;padding:7px 12px;white-space:nowrap}
main{padding:12px 0 140px}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;padding:8px 0 10px;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button b{font-size:22px;line-height:1}
.tabs button.on{color:var(--p)}
.fab{position:fixed;right:max(16px,calc(50% - 304px));bottom:calc(76px + env(safe-area-inset-bottom));z-index:7;width:60px;height:60px;border-radius:50%;background:var(--acc);color:#fff;font-size:32px;box-shadow:0 6px 18px rgba(22,163,74,.4)}
/* lists */
.search{margin-bottom:10px}
.group{margin-top:14px}
.group h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 4px 6px}
.list{background:var(--card);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;min-height:64px}
.row:last-child{border-bottom:0}
.row:active{background:#f9fafb}
.thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;background:#f3f4f6;flex:none;display:grid;place-items:center;font-size:26px}
.rbody{flex:1;min-width:0}
.rbody b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbody small{color:var(--muted)}
.row.off .rbody b{color:var(--muted);text-decoration:line-through}
.tag{font-size:11px;background:#f3f4f6;border-radius:6px;padding:1px 6px;margin-inline-start:4px}
/* switch */
.sw{position:relative;width:50px;height:30px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:999px;background:#d1d5db;transition:.15s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.15s}
.sw input:checked+span{background:var(--acc)}
.sw input:checked+span::after{transform:translateX(20px)}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.empty b{display:block;font-size:44px;margin-bottom:6px}
/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
.sh{background:#fff;border-bottom:1px solid var(--line)}
.sh .wrap{display:flex;align-items:center;gap:10px;height:56px}
.sh h2{flex:1;font-size:18px}
.sh .x{width:40px;height:40px;border-radius:50%;background:#f3f4f6;font-size:18px}
.sb{flex:1;overflow-y:auto;padding:14px 0 24px}
.sf{background:#fff;border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.sf .wrap{display:flex;gap:10px}
.sf .btn{flex:1}
.card{background:#fff;border-radius:var(--r);padding:14px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.stats div{background:#fff;border-radius:12px;padding:8px 4px;text-align:center}
.stats b{display:block;font-size:17px;white-space:nowrap}
.stats small{color:var(--muted);font-size:11.5px}
.stnote{color:var(--muted);font-size:12px;margin:4px 2px 0}
.card h3{font-size:15px;margin-bottom:8px}
.f{display:block;margin-bottom:12px}
.f:last-child{margin-bottom:0}
.f>span{display:block;font-weight:600;font-size:14px;margin-bottom:5px}
.f small{display:block;color:var(--muted);font-size:12.5px;margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.price{font-size:22px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;background:#fff}
.chip.on{border-color:var(--p);background:var(--p);color:#fff}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.tog:first-of-type{border-top:0}
.tog small{display:block;color:var(--muted);font-size:13px}
.photo{border:2px dashed #d1d5db;border-radius:var(--r);display:grid;place-items:center;aspect-ratio:4/3;background:#fafafa;color:var(--muted);font-weight:600;position:relative;overflow:hidden;width:100%}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo b{font-size:40px;display:block;text-align:center}
.pacts{display:flex;gap:8px;margin-top:8px}
.pacts .btn{flex:1;min-height:42px;padding:8px}
details{background:#fff;border-radius:var(--r);padding:0 14px;margin-bottom:12px}
details summary{padding:14px 0;font-weight:600;cursor:pointer;list-style:none}
details summary::after{content:"＋";float:right;color:var(--muted)}
details[open] summary::after{content:"－"}
details[open]{padding-bottom:14px}
.vg{border:1.5px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.vgh{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.vgh input{font-weight:700}
.vc{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.vc input.l{flex:1.4}
.vc input.pp{flex:1;min-width:0}
.vc input[type=color]{flex:0 0 46px;padding:2px;height:44px}
.ib{width:40px;height:44px;border-radius:10px;background:#f3f4f6;flex:none;font-size:16px}
.ib.on{background:#fee2e2}
.add{color:#4f46e5;font-weight:600;padding:6px 2px;font-size:14px}
.qa{display:flex;flex-wrap:wrap;gap:8px}
.qa button{border:1.5px dashed #c7d2fe;color:#4338ca;border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600}
.arrows{display:flex;gap:4px}
.arrows button{width:36px;height:36px;border-radius:8px;background:#f3f4f6}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:4px 10px;max-height:260px;overflow-y:auto;margin-top:8px;font-size:14px}
.wgrid label{display:flex;gap:6px;align-items:center}
.wgrid input{width:auto}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:30;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.toast.bad{background:var(--red)}
.busy{position:fixed;inset:0;z-index:40;background:rgba(255,255,255,.6);display:grid;place-items:center}
.spin{width:40px;height:40px;border-radius:50%;border:4px solid #e5e7eb;border-top-color:var(--p);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.savebar{position:sticky;bottom:calc(66px + env(safe-area-inset-bottom));padding:8px 0;z-index:4}
.savebar .btn{box-shadow:0 6px 18px rgba(22,163,74,.35)}
.hint{color:var(--muted);font-size:13px;margin:4px 4px 10px}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<script src="wilayas.js"></script>
<script src="config.js"></script>
<script>
(function () {
'use strict';
var C = window.CONFIG || {}, W = window.WILAYAS || [];
var root = document.getElementById('root');
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function $(s, el) { return (el || root).querySelector(s); }
function toast(m, bad) { var t = document.getElementById('toast'); t.textContent = m; t.className = 'toast on' + (bad ? ' bad' : ''); clearTimeout(toast.h); toast.h = setTimeout(function () { t.className = 'toast'; }, 2400); }
function busy(on) { var b = document.getElementById('busy'); if (on && !b) { b = document.createElement('div'); b.id = 'busy'; b.className = 'busy'; b.innerHTML = '<div class="spin"></div>'; document.body.appendChild(b); } else if (!on && b) b.remove(); }
function money(n) { return String(Math.round(+n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' DA'; }
function uid() { return (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }

if (!C.supabase || !C.supabase.url) {
  root.innerHTML = '<div class="login"><form><h1>⚙️ Configuration</h1><p>Ajoutez <code>supabase</code> dans <code>config.js</code>.</p></form></div>';
  return;
}

/* ================= Supabase (plain fetch, no library) ================= */
// The shop is found from the login (owners have one). ?shop=slug or a config shop can pre-select one.
var SB = C.supabase.url.replace(/\/$/, ''), KEY = C.supabase.key;
var qShop = (/[?&]shop=([a-z0-9-]+)/.exec(location.search) || [])[1] || null;
var SHOP = qShop || C.shop || null, isAdmin = false, shopList = null;
var SKEY = 'wo_admin';
var sess = null; try { sess = JSON.parse(localStorage.getItem(SKEY) || 'null'); } catch (e) {}
function saveSess() { try { if (sess) localStorage.setItem(SKEY, JSON.stringify(sess)); else localStorage.removeItem(SKEY); } catch (e) {} }

function authCall(grant, body) {
  return fetch(SB + '/auth/v1/token?grant_type=' + grant, { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
    .then(function (r) { return r.json().then(function (j) {
      if (!r.ok) throw new Error(/invalid/i.test(j.error_description || j.msg || j.error || '') ? 'Email ou mot de passe incorrect' : (j.error_description || j.msg || 'Erreur de connexion'));
      sess = { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Math.floor(Date.now() / 1000) + (j.expires_in || 3600), user: { id: j.user && j.user.id, email: j.user && j.user.email } };
      saveSess(); return sess;
    }); });
}
function token() {
  if (!sess) return Promise.reject(new Error('auth'));
  if (sess.expires_at - 60 > Date.now() / 1000) return Promise.resolve(sess.access_token);
  return authCall('refresh_token', { refresh_token: sess.refresh_token }).then(function (s) { return s.access_token; })
    .catch(function (e) { if (navigator.onLine) { sess = null; saveSess(); } throw e; });
}
function api(method, path, body, extra) {
  return token().then(function (tk) {
    var h = { apikey: KEY, Authorization: 'Bearer ' + tk };
    if (body !== undefined && !(body instanceof Blob)) { h['Content-Type'] = 'application/json'; h.Prefer = 'return=representation'; }
    Object.keys(extra || {}).forEach(function (k) { h[k] = extra[k]; });
    return fetch(SB + path, { method: method, headers: h, body: body === undefined ? undefined : (body instanceof Blob ? body : JSON.stringify(body)) });
  }).then(function (r) {
    if (r.status === 401) { sess = null; saveSess(); render(); throw new Error('Session expirée, reconnectez-vous'); }
    if (!r.ok) return r.text().then(function (t) { throw new Error('Erreur ' + r.status + (t ? ' : ' + t.slice(0, 120) : '')); });
    return r.status === 204 ? null : r.text().then(function (t) { return t ? JSON.parse(t) : null; });
  });
}
var rest = {
  get: function (p) { return api('GET', '/rest/v1/' + p); },
  ins: function (t, row) { return api('POST', '/rest/v1/' + t, row).then(function (r) { return r[0]; }); },
  upd: function (t, id, row) { return api('PATCH', '/rest/v1/' + t + '?id=eq.' + encodeURIComponent(id), row).then(function (r) { if (!r || !r.length) throw new Error('Non autorisé'); return r[0]; }); },
  del: function (t, id) { return api('DELETE', '/rest/v1/' + t + '?id=eq.' + encodeURIComponent(id)); }
};
function publicUrl(path) { return SB + '/storage/v1/object/public/photos/' + path; }
function pathOf(url) { var i = (url || '').indexOf('/object/public/photos/'); return i < 0 ? null : url.slice(i + 22); }
function thumbOf(p) { return p.replace(/(\.\w+)$/, '_t$1'); }
function upload(path, blob) { return api('POST', '/storage/v1/object/photos/' + path, blob, { 'Content-Type': blob.type, 'cache-control': 'max-age=31536000', 'x-upsert': 'true' }); }
function removePhoto(url) {
  var p = pathOf(url); if (!p) return Promise.resolve();
  return api('DELETE', '/storage/v1/object/photos', { prefixes: [p, thumbOf(p)] }).catch(function () {});
}

/* ================= photo compression ================= */
function loadImg(file) {
  return new Promise(function (ok, ko) { var u = URL.createObjectURL(file), im = new Image(); im.onload = function () { ok(im); }; im.onerror = function () { ko(new Error('Image illisible')); }; im.src = u; });
}
function toBlob(cv, type, q) { return new Promise(function (ok) { cv.toBlob(ok, type, q); }); }
function shrink(im, max, target) {
  var s = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight)), cv = document.createElement('canvas');
  cv.width = Math.round(im.naturalWidth * s); cv.height = Math.round(im.naturalHeight * s);
  var ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.drawImage(im, 0, 0, cv.width, cv.height);
  var qs = [0.82, 0.72, 0.62, 0.52, 0.42, 0.34], i = 0, type = 'image/webp';
  function next() {
    return toBlob(cv, type, qs[i]).then(function (b) {
      if (b && b.type !== type) { type = 'image/jpeg'; return next(); }      // old Safari: no webp encoder
      if (b.size <= target || i === qs.length - 1) return b;
      i++; return next();
    });
  }
  return next();
}
function compress(file, max, target, thumbMax, thumbTarget) {
  return loadImg(file).then(function (im) {
    return Promise.all([shrink(im, max, target), thumbMax ? shrink(im, thumbMax, thumbTarget) : null]);
  });
}
function uploadPhoto(file, max, target) {
  return compress(file, max, target, 320, 20000).then(function (b) {
    var ext = b[0].type === 'image/webp' ? '.webp' : '.jpg', p = SHOP + '/' + uid() + ext;
    return Promise.all([upload(p, b[0]), upload(thumbOf(p), b[1])]).then(function () { return { url: publicUrl(p), size: b[0].size }; });
  });
}

/* ================= state ================= */
var S = { shop: null, cats: [], items: [], stats: null }, tab = 'items', q = '', sheet = null, loadErr = '';
function rpc(fn, args) { return api('POST', '/rest/v1/rpc/' + fn, args || {}); }
// which shop does this login manage? owner → their shop; platform admin (you) → a picker
var adminChecked = false;
function pickShop(id) { SHOP = id; S.shop = null; S.stats = null; tab = 'items'; try { history.replaceState(null, '', '?shop=' + id); } catch (e) {} load(); }
function load() {
  busy(true);
  var ready = adminChecked ? Promise.resolve() :
    rpc('is_platform_admin').then(function (a) { isAdmin = a === true; }, function () { isAdmin = false; }).then(function () { adminChecked = true; });
  return ready.then(function () {
    if (SHOP) return loadShop();
    return rest.get('shops?owner=eq.' + encodeURIComponent(sess.user.id) + '&select=id,settings&order=created_at').then(function (rows) {
      if (rows.length === 1 && !isAdmin) { SHOP = rows[0].id; return loadShop(); }
      if (isAdmin) return rpc('platform_shops').then(function (r) { busy(false); shopList = r; render(); });
      if (!rows.length) throw new Error('Aucune boutique liée à ce compte (' + sess.user.email + ').');
      shopList = rows.map(function (r) { return { id: r.id, name: ((r.settings || {}).business || {}).name }; }); busy(false); render();
    });
  }).catch(function (e) { busy(false); loadErr = e.message; render(); });
}
function loadShop() {
  return rest.get('shops?id=eq.' + encodeURIComponent(SHOP) + '&select=id,owner,settings,status,paid_until,categories(*),items(*)').then(function (rows) {
    busy(false);
    if (!rows || !rows.length) { loadErr = 'Boutique « ' + SHOP + ' » introuvable.'; return render(); }
    if (rows[0].owner !== sess.user.id && !isAdmin) { loadErr = 'Ce compte n\'a pas accès à cette boutique.'; return render(); }
    rpc('order_stats', { p_shop: SHOP }).then(function (st) { S.stats = st; if (tab === 'items' && !sheet) render(); }, function () {});
    S.shop = rows[0]; S.cats = (rows[0].categories || []).sort(byPos); S.items = (rows[0].items || []).sort(byPos);
    loadErr = ''; render();
  }).catch(function (e) { busy(false); loadErr = e.message; render(); });
}
function byPos(a, b) { return (a.position - b.position) || String(a.name).localeCompare(String(b.name)); }
function catName(id) { var c = S.cats.filter(function (c) { return c.id === id; })[0]; return c ? (c.icon ? c.icon + ' ' : '') + c.name : 'Sans catégorie'; }

/* ================= render ================= */
function render() {
  if (!sess) return renderLogin();
  if (!S.shop && !SHOP && shopList && !loadErr) {
    root.innerHTML = '<header class="top"><div class="wrap"><h1>Choisir une boutique</h1>' + (isAdmin ? '<a href="platform.html">🧭 Plateforme</a>' : '') + '<button data-a="logout">Sortir</button></div></header><main class="wrap"><div class="list" style="margin-top:12px">' +
      shopList.map(function (r) { return '<button class="row" data-a="pick-shop" data-id="' + esc(r.id) + '" style="width:100%;text-align:start"><div class="rbody"><b>' + esc(r.name || r.id) + '</b><small>' + esc(r.id) + (r.open === false ? ' · fermé' : '') + '</small></div></button>'; }).join('') + '</div></main>';
    return;
  }
  if (!S.shop) {
    root.innerHTML = '<div class="login"><form onsubmit="return false"><h1>' + (loadErr ? '⚠️' : '…') + '</h1><p>' + esc(loadErr || 'Chargement') + '</p>' +
      (loadErr ? '<button class="btn pri" data-a="reload">Réessayer</button><p style="margin-top:12px"><button class="btn ghost" data-a="logout" style="width:100%">Se déconnecter</button></p>' : '') + '</form></div>';
    return;
  }
  var st = S.shop.settings || {}, b = st.business || {};
  var h = '<header class="top"><div class="wrap"><h1>' + esc(b.name || SHOP) + '</h1><a href="/' + esc(SHOP) + '" target="_blank" rel="noopener">👁 Voir</a>' + (isAdmin ? '<button data-a="switch">⇄</button>' : '') + '<button data-a="logout" >Sortir</button></div></header><main class="wrap">';
  if (S.shop.status === 'suspended' || (S.shop.paid_until && S.shop.paid_until < new Date().toISOString().slice(0, 10))) h += '<div class="card" style="background:#fef2f2;margin-top:12px"><b>⛔ Menu fermé au public.</b> Contactez votre prestataire.</div>';
  if (tab === 'items') h += itemsTab(); else if (tab === 'cats') h += catsTab(); else h += shopTab(st);
  h += '</main>';
  if (tab === 'items') h += '<button class="fab" data-a="new-item" aria-label="Ajouter un article">+</button>';
  h += '<nav class="tabs">' + [['items', '🍽️', 'Articles'], ['cats', '🗂️', 'Catégories'], ['shop', '🏪', 'Boutique']].map(function (t) {
    return '<button data-a="tab" data-t="' + t[0] + '" class="' + (tab === t[0] ? 'on' : '') + '"><b>' + t[1] + '</b>' + t[2] + '</button>';
  }).join('') + '</nav>';
  if (sheet) h += sheet.type === 'item' ? itemSheet() : catSheet();
  var y = window.scrollY, sb = $('.sb'), sy = sb ? sb.scrollTop : 0;
  root.innerHTML = h;
  window.scrollTo(0, y); var nsb = $('.sb'); if (nsb) nsb.scrollTop = sy;
}

function renderLogin(err) {
  root.innerHTML = '<div class="login"><form id="login"><h1>🔐 Connexion</h1><p>Gérez votre menu en quelques secondes.</p>' +
    '<label for="em">Email</label><input id="em" type="email" autocomplete="username" required>' +

function kindOf(v) { if (v.kind) return v.kind; if (v.multi) return 'extra'; if (v.choices.some(function (c) { return c.color; })) return 'color'; if (v.choices.some(function (c) { return c.price != null; })) return 'size'; return 'option'; }
function toEditor(vs) { return clone(vs || []).map(function (v) { v.kind = kindOf(v); v.choices.forEach(function (c) { c.p = v.kind === 'size' ? c.price : v.kind === 'color' ? null : c.add; }); return v; }); }
function fromEditor(vs) {
  return vs.map(function (v) {
    var o = { name: (v.name || KINDS[v.kind]).trim(), kind: v.kind };
    if (v.name_ar) o.name_ar = v.name_ar; else if (!v.name || v.name === KINDS[v.kind]) o.name_ar = KIND_AR[v.kind];
    if (v.kind === 'extra') o.multi = true;
    o.choices = v.choices.filter(function (c) { return String(c.label || '').trim(); }).map(function (c) {
      var x = { label: c.label.trim() }; if (c.label_ar) x.label_ar = c.label_ar;
      var p = c.p === '' || c.p == null ? null : Math.max(0, Math.round(+c.p));
      if (v.kind === 'size' && p != null) x.price = p;
      if ((v.kind === 'option' || v.kind === 'extra') && p) x.add = p;
      if (v.kind === 'color') x.color = c.color || '#000000';

    return o;
  }).filter(function (v) { return v.choices.length; });
}

    var per = typeof f === 'object' && f ? Object.keys(f).filter(function (k) { return k !== 'default'; }).map(function (k) { return k + '=' + f[k]; }).join(', ') : '';
    h += '<div class="vg"><div class="vgh"><input data-o="' + i + '" data-ok="label" value="' + esc(o.label) + '" placeholder="Ex : Livraison à domicile"><button class="ib" data-a="rm-opt" data-i="' + i + '" aria-label="Supprimer">🗑</button></div>' +
      '<div class="two"><label class="f"><span>Prix (DA)</span><input type="number" inputmode="numeric" data-o="' + i + '" data-ok="def" value="' + def + '"></label>' +
      '<label class="f"><span>En arabe</span><input dir="rtl" data-o="' + i + '" data-ok="label_ar" value="' + esc(o.label_ar) + '"></label></div>' +
      '<label class="f"><span>Prix spéciaux par wilaya</span><input data-o="' + i + '" data-ok="per" value="' + esc(per) + '" placeholder="16=500, 31=400"><small>Optionnel. Code wilaya = prix.</small></label>' +
      '<div class="tog"><div><b>Demander l\'adresse</b><small>Éteint pour « à emporter »</small></div><label class="sw"><input type="checkbox" data-o="' + i + '" data-ok="address"' + (o.address !== false ? ' checked' : '') + '><span></span></label></div></div>';
  });
  h += '<button class="add" data-a="add-opt">+ Ajouter un mode (ex : À emporter, Stop desk)</button>' +
    '<div class="two" style="margin-top:12px"><label class="f"><span>Gratuite dès (DA)</span><input type="number" inputmode="numeric" data-p="delivery.freeAbove" value="' + esc(D.freeAbove || '') + '" placeholder="0 = non"></label>' +
    '<label class="f"><span>Commande min. (DA)</span><input type="number" inputmode="numeric" data-p="delivery.minOrder" value="' + esc(D.minOrder || '') + '" placeholder="0"></label></div></div>';
  h += '<div class="card"><h3>Outils</h3><a class="btn ghost" style="width:100%;text-decoration:none" href="qr.html?shop=' + esc(SHOP) + '" target="_blank" rel="noopener">📱 Affiche QR code</a></div>';
  h += '<div class="savebar"><button class="btn green" style="width:100%" data-a="save-shop">Enregistrer la boutique</button></div></div>';
  return h;
}
function fld(p, label, v, ph, ar) { return '<label class="f"><span>' + label + '</span><input data-p="' + p + '"' + (ar ? ' dir="rtl"' : '') + ' value="' + esc(v) + '" placeholder="' + esc(ph || '') + '"></label>'; }
function setPath(o, p, v) { var k = p.split('.'); for (var i = 0; i < k.length - 1; i++) { if (!o[k[i]] || typeof o[k[i]] !== 'object') o[k[i]] = {}; o = o[k[i]]; } o[k[k.length - 1]] = v; }
function normWa(v) { var d = String(v || '').replace(/\D/g, ''); if (d.indexOf('00213') === 0) d = d.slice(2); if (d.charAt(0) === '0') d = '213' + d.slice(1); return d; }
function parsePer(def, txt) {
  var o = {}, any = false;
  String(txt || '').split(/[,;\n]/).forEach(function (s) { var m = s.trim().match(/^(\d{1,2})\s*[=:]\s*(\d+)$/); if (m) { o[('0' + m[1]).slice(-2)] = +m[2]; any = true; } });
  if (!any) return +def || 0; o['default'] = +def || 0; return o;
}
function saveShop() {
  var st = S.shop.settings, b = st.business || {};
  if (!String(b.name || '').trim()) return toast('Le nom est obligatoire', true);
  var wa = String(b.whatsapp || '');
  if (!/^213[5-7]\d{8}$/.test(wa) && !/^213[2-4]\d{7}$/.test(wa)) return toast('Numéro WhatsApp invalide', true);
  st.demo = false;
  busy(true);
  rest.upd('shops', SHOP, { settings: st }).then(function (r) { S.shop.settings = r.settings; busy(false); render(); toast('✓ Boutique enregistrée'); })
    .catch(function (e) { busy(false); toast(e.message, true); });
}

/* ================= events ================= */
root.addEventListener('click', function (e) {
  var el = e.target.closest('[data-a]'); if (!el) return;
  var a = el.getAttribute('data-a'), id = el.getAttribute('data-id');
  if (el.tagName === 'INPUT' && el.type !== 'checkbox') return;
  if (a === 'avail' || a === 'wil') return;                       // handled on change
  e.preventDefault();
  var d = sheet && sheet.d, g = +el.getAttribute('data-g'), c = +el.getAttribute('data-c');
  switch (a) {
    case 'tab': tab = el.getAttribute('data-t'); sheet = null; render(); window.scrollTo(0, 0); break;
    case 'logout': if (confirm('Se déconnecter ?')) { sess = null; saveSess(); S.shop = null; SHOP = qShop || C.shop || null; shopList = null; isAdmin = false; adminChecked = false; render(); } break;
    case 'reload': load(); break;
    case 'new-item': openItem(null); break;
    case 'edit-item': openItem(S.items.filter(function (i) { return i.id === id; })[0]); break;
    case 'close': sheet = null; render(); break;
    case 'pick-cat': d.category_id = id || null; render(); break;
    case 'rm-photo': sheet.file = null; sheet.preview = null; sheet.dropPhoto = true; render(); break;
    case 'add-group': d.v.push(PRESETS[el.getAttribute('data-k')]((S.shop.settings || {}).mode)); render(); break;
    case 'rm-group': d.v.splice(g, 1); render(); break;
    case 'add-choice': d.v[g].choices.push({ label: '', p: '', color: '#888888' }); render(); var ins = root.querySelectorAll('[data-g="' + g + '"][data-ck="label"]'); if (ins.length) ins[ins.length - 1].focus(); break;
    case 'rm-choice': d.v[g].choices.splice(c, 1); render(); break;
    case 'so-choice': d.v[g].choices[c].soldOut = !d.v[g].choices[c].soldOut; render(); break;
    case 'save-item': saveItem(); break;
    case 'del-item':
      if (!confirm('Supprimer « ' + d.name + ' » ?')) return;
      busy(true); rest.del('items', d.id).then(function () { if (d.photo) removePhoto(d.photo); S.items = S.items.filter(function (i) { return i.id !== d.id; }); busy(false); sheet = null; render(); toast('Supprimé'); }).catch(function (er) { busy(false); toast(er.message, true); });
      break;
    case 'new-cat': sheet = { type: 'cat', isNew: true, d: { name: '', icon: '', name_ar: '' } }; render(); break;
    case 'edit-cat': if (e.target.closest('.arrows')) return; sheet = { type: 'cat', d: clone(S.cats.filter(function (x) { return x.id === id; })[0]) }; render(); break;
    case 'save-cat': saveCat(); break;
    case 'del-cat':
      if (!confirm('Supprimer la catégorie « ' + d.name + ' » ? Ses articles restent, sans catégorie.')) return;
      busy(true); rest.del('categories', d.id).then(function () { S.cats = S.cats.filter(function (x) { return x.id !== d.id; }); S.items.forEach(function (i) { if (i.category_id === d.id) i.category_id = null; }); busy(false); sheet = null; render(); }).catch(function (er) { busy(false); toast(er.message, true); });
      break;
    case 'cat-up': moveCat(+el.getAttribute('data-i'), -1); break;
    case 'cat-down': moveCat(+el.getAttribute('data-i'), 1); break;
    case 'pick-shop': pickShop(id); break;
    case 'switch': SHOP = null; S.shop = null; shopList = null; try { history.replaceState(null, '', location.pathname); } catch (e2) {} load(); break;
    case 'theme': S.shop.settings.theme = el.getAttribute('data-v'); render(); break;
    case 'day': var bb = S.shop.settings.business = S.shop.settings.business || {}, dv = +el.getAttribute('data-v'), dd = bb.closedDays = bb.closedDays || [], di = dd.indexOf(dv); if (di >= 0) dd.splice(di, 1); else dd.push(dv); render(); break;
    case 'rm-cover': delete S.shop.settings.business.cover; render(); break;
    case 'mode': S.shop.settings.mode = el.getAttribute('data-v'); render(); break;
    case 'lang': S.shop.settings.lang = el.getAttribute('data-v'); render(); break;
    case 'zone': var D = S.shop.settings.delivery = S.shop.settings.delivery || {}; D.wilayas = el.getAttribute('data-v') === 'all' ? [] : (D.wilayas && D.wilayas.length ? D.wilayas : ['31']); render(); break;
    case 'add-opt': var DD = S.shop.settings.delivery = S.shop.settings.delivery || {}; (DD.options = DD.options || []).push({ id: 'o' + Date.now().toString(36), label: 'À emporter', label_ar: 'استلام من المحل', fee: 0, address: false }); render(); break;
    case 'rm-opt': S.shop.settings.delivery.options.splice(+el.getAttribute('data-i'), 1); render(); break;
    case 'save-shop': saveShop(); break;
  }
});
root.addEventListener('input', function (e) {
  var el = e.target, d = sheet && sheet.d, k;
  if (el.id === 'q') { q = el.value; var pos = el.selectionStart; render(); var nq = $('#q'); nq.focus(); nq.setSelectionRange(pos, pos); return; }
  if (d && (k = el.getAttribute('data-k'))) { d[k] = el.type === 'checkbox' ? el.checked : el.value; return; }
  if (d && el.hasAttribute('data-vk')) { var v = d.v[+el.getAttribute('data-g')], vk = el.getAttribute('data-vk'); if (vk === 'kind') { if (v.name === KINDS[v.kind]) v.name = KINDS[el.value]; v.kind = el.value; render(); } else v.name = el.value; return; }
  if (d && el.hasAttribute('data-ck')) { d.v[+el.getAttribute('data-g')].choices[+el.getAttribute('data-c')][el.getAttribute('data-ck')] = el.value; return; }
  var st = S.shop && S.shop.settings;
  if (!st) return;
  if ((k = el.getAttribute('data-p'))) { setPath(st, k, el.type === 'number' ? (el.value === '' ? 0 : +el.value) : el.value); return; }
  if (el.getAttribute('data-s') === 'wa') { setPath(st, 'business.whatsapp', normWa(el.value)); return; }
  if (el.hasAttribute('data-o')) {
    var o = st.delivery.options[+el.getAttribute('data-o')], ok = el.getAttribute('data-ok'), box = el.closest('.vg');
    if (ok === 'label' || ok === 'label_ar') o[ok] = el.value;
    else if (ok === 'address') { if (el.checked) delete o.address; else o.address = false; }
    else o.fee = parsePer($('[data-ok=def]', box).value, $('[data-ok=per]', box).value);
  }
});
root.addEventListener('change', function (e) {
  var el = e.target;
  if (el.getAttribute('data-a') === 'avail') {
    var it = S.items.filter(function (i) { return i.id === el.getAttribute('data-id'); })[0], v = el.checked;
    it.available = v; el.closest('.row').classList.toggle('off', !v);
    rest.upd('items', it.id, { available: v }).then(function () { toast(v ? '✓ ' + it.name + ' disponible' : it.name + ' : épuisé'); })
      .catch(function (er) { it.available = !v; render(); toast(er.message, true); });
    return;
  }
  if (el.getAttribute('data-a') === 'wil') {
    var D = S.shop.settings.delivery; D.wilayas = [].map.call(root.querySelectorAll('[data-a=wil]:checked'), function (x) { return x.value; }); return;
  }
  if (el.id === 'ph' && el.files[0]) {
    sheet.file = el.files[0]; sheet.dropPhoto = false;
    if (sheet.preview) URL.revokeObjectURL(sheet.preview);
    sheet.preview = URL.createObjectURL(el.files[0]); render(); return;
  }
  if (el.id === 'cover' && el.files[0]) {
    busy(true);
    compress(el.files[0], 1400, 160000).then(function (bl) {
      var p = SHOP + '/cover-' + uid() + (bl[0].type === 'image/webp' ? '.webp' : '.jpg');
      return upload(p, bl[0]).then(function () { setPath(S.shop.settings, 'business.cover', publicUrl(p)); busy(false); render(); toast('Couverture prête. Enregistrez la boutique.'); });
    }).catch(function (er) { busy(false); toast(er.message, true); });
    return;
  }
  if (el.id === 'logo' && el.files[0]) {
    busy(true);
    compress(el.files[0], 300, 40000).then(function (bl) {
      var p = SHOP + '/logo-' + uid() + (bl[0].type === 'image/webp' ? '.webp' : '.jpg');
      return upload(p, bl[0]).then(function () { setPath(S.shop.settings, 'business.logo', publicUrl(p)); busy(false); render(); toast('Logo prêt. Enregistrez la boutique.'); });
    }).catch(function (er) { busy(false); toast(er.message, true); });
  }
});
window.addEventListener('keydown', function (e) { if (e.key === 'Escape' && sheet) { sheet = null; render(); } });

window.__admin = { shop: function () { return SHOP; }, isAdmin: function () { return isAdmin; }, state: S, fromEditor: fromEditor, toEditor: toEditor, normWa: normWa, parsePer: parsePer };
if (sess) load(); else render();
})();
</script>
